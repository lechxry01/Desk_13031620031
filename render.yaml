services:
  - type: web
    name: ai-trading-desk-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_KEY          # รหัสเข้าใช้งาน: ดูค่าได้ที่ Render > Environment
        generateValue: true
